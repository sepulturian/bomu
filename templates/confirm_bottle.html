{% extends "base.html" %}

{% block title %}Confirm Bottle &middot; Bomu{% endblock %}

{% block content %}
<h1>Confirm Bottle</h1>
<p style="color: var(--ink-dim); font-size: 0.9rem; margin-bottom: 1.15rem;">
    Review what the label read, adjust if needed, then save.
</p>

<form method="POST" action="/add">
    <div class="form-group">
        <label for="name">Bottle Name</label>
        <input type="text" id="name" name="name" value="{{ bottle.name }}" required>
    </div>

    <div class="form-group">
        <label for="type">Bottle Type</label>
        <select id="type" name="type" required>
            <option value="">Choose type &mdash;</option>
            {% for value, label in BOTTLE_TYPE_CHOICES %}
                <option value="{{ value }}" {% if bottle.type == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="brand">Brand (optional)</label>
        <input type="text" id="brand" name="brand" value="{{ bottle.brand }}">
    </div>

    <div style="display: flex; gap: 0.65rem; margin-top: 0.35rem;">
        <button type="submit" class="btn" style="flex: 1;">Add to My Bar</button>
        <a href="/scan" class="btn btn-secondary">Scan Again</a>
    </div>
</form>
{% endblock %}
