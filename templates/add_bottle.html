{% extends "base.html" %}

{% block content %}
<h1>Add a Bottle</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Bottle Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Hendrick's Gin" required>
    </div>

    <div class="form-group">
        <label for="type">Type</label>
        {# Driven by BOTTLE_TYPE_CHOICES like the other three bottle forms. This
           list used to be hardcoded here, which is exactly the drift that puts
           a type in one form and not another. #}
        <select id="type" name="type" required>
            <option value="">Pick a type...</option>
            {% for value, label in BOTTLE_TYPE_CHOICES %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="brand">Brand (optional)</label>
        <input type="text" id="brand" name="brand" placeholder="e.g. Hendrick's">
    </div>

    <button type="submit" class="btn">Add to My Bar</button>
</form>
{% endblock %}
