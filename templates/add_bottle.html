{% extends "base.html" %}
{% set hide_topbar = true %}
{% set hide_tabbar = true %}
{% from "components/icons.html" import ui_icon %}

{% block title %}Add Bottle &middot; Bomu{% endblock %}

{% block content %}
<div class="form-page-narrow">
<a href="/bar" class="back-link">
    {{ ui_icon("back", "btn-icon") }}
    <span>Bar</span>
</a>

<h1>Add a Bottle</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Bottle Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Hendrick's Gin" required>
    </div>

    <div class="form-group">
        <label for="type">Bottle Type</label>
        <select id="type" name="type" required>
            <option value="">Choose type...</option>
            {% for value, label in BOTTLE_TYPE_CHOICES %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="brand">Brand (optional)</label>
        <input type="text" id="brand" name="brand" placeholder="e.g. Hendrick's">
    </div>

    <button type="submit" class="btn" style="width: 100%; margin-top: 0.35rem;">Add to my bar</button>
</form>
</div>
{% endblock %}
