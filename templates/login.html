{% extends "base.html" %}
{% from "components/icons.html" import glass_icon %}

{% block title %}Log in &middot; Bomu{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        position: relative;
        aspect-ratio: 3 / 2;
        max-height: 210px;
        border-radius: var(--radius-card);
        overflow: hidden;
        background: var(--bg-elevated);
        border: 1px solid var(--border-highlight);
        max-width: 315px;
        margin: 0 auto 1.5rem;
    }

    .auth-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .auth-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(20, 14, 10, 0.1) 30%, rgba(20, 14, 10, 0.92) 100%);
    }

    .auth-caption {
        position: absolute;
        left: 1.15rem;
        right: 1.15rem;
        bottom: 1rem;
    }

    .auth-caption h1 {
        margin-bottom: 0.2rem;
    }
</style>
{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 0.5rem auto 0;">
    <div class="auth-card">
        <img src="/static/auth-login.jpg" alt="Cocktail stirred on a dark bar" fetchpriority="high">
        <div class="auth-scrim"></div>
        <div class="auth-caption">
            <h1>Bomu</h1>
            <p style="font-size: 0.86rem; color: var(--ink-dim);">Your shelf, ready to pour</p>
        </div>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required
                   autocapitalize="none" autocorrect="off" autocomplete="username"
                   value="{{ username or '' }}">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Log in</button>
    </form>

    <p style="text-align: center; margin-top: 1.4rem; color: var(--ink-dim); font-size: 0.9rem;">
        New here? <a href="{{ url_for('signup') }}" style="color: var(--zest); font-weight: 600;">Sign up with an invite code</a>
    </p>
</div>
{% endblock %}
